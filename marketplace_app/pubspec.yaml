name: marketplace_app
description: Multi-Vendor Marketplace Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.4
  phone_number: ^2.1.0
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Maps
  google_maps_flutter: ^2.5.3

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.0

  # Auth
  flutter_facebook_auth: ^6.1.1
  google_sign_in: ^6.2.1

  # Payments
  flutter_stripe: ^10.0.0

  # Image
  photo_view: ^0.14.0

  # Pull to refresh
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
